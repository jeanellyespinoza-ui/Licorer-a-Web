<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DESTÁPALA</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;500;700&display=swap" rel="stylesheet">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Poppins,sans-serif;
}

body{
background:#fff;
color:#222;
}

header{
background:white;
padding:18px 50px;
display:flex;
justify-content:space-between;
align-items:center;
box-shadow:0 2px 10px rgba(0,0,0,.08);
position:sticky;
top:0;
z-index:100;
}

.logo{
font-size:34px;
font-weight:700;
color:#b88a2a;
}

nav a{
margin-left:25px;
text-decoration:none;
color:#222;
font-weight:500;
}

.hero{
height:85vh;
background:url("https://images.unsplash.com/photo-1514362545857-3bc16c4c7d1b?auto=format&fit=crop&w=1600&q=80") center center/cover;
display:flex;
justify-content:center;
align-items:center;
}

.hero div{
background:rgba(255,255,255,.90);
padding:50px;
border-radius:20px;
text-align:center;
}

.hero h1{
font-size:60px;
color:#b88a2a;
}

.hero p{
font-size:22px;
margin-top:15px;
}

.boton{

display:inline-block;
margin-top:30px;
background:#b88a2a;
color:white;
padding:15px 35px;
border-radius:40px;
text-decoration:none;
font-weight:bold;

}

.seccion{

padding:70px 8%;

}

.titulo{

text-align:center;
font-size:40px;
margin-bottom:50px;

}

.categorias{

display:grid;
grid-template-columns:repeat(auto-fit,minmax(180px,1fr));
gap:20px;

}

.categoria{

background:white;
padding:30px;
text-align:center;
border-radius:15px;
box-shadow:0 5px 15px rgba(0,0,0,.08);
transition:.3s;

}

.categoria:hover{

transform:translateY(-8px);

}

footer{

background:#111;
color:white;
text-align:center;
padding:30px;

}

</style>

</head>

<body>

<header>

<div class="logo">DESTÁPALA</div>

<nav>

<a href="#">Inicio</a>
<a href="#">Productos</a>
<a href="#">Promociones</a>
<a href="#">Contacto</a>

</nav>

</header>

<section class="hero">

<div>

<h1>DESTÁPALA</h1>

<p>Salud por ti, por mí y... ¡Destápala!</p>

<a class="boton" href="#">Ver Catálogo</a>

</div>

</section>

<section class="seccion">

<h2 class="titulo">

Nuestras Categorías

</h2>

<div class="categorias">

<div class="categoria">🥃<br><br>Whisky</div>

<div class="categoria">🍷<br><br>Vinos</div>

<div class="categoria">🍺<br><br>Cervezas</div>

<div class="categoria">🍸<br><br>Vodka</div>

<div class="categoria">🍹<br><br>Ron</div>

<div class="categoria">🍇<br><br>Pisco</div>

</div>

</section>

<footer>

DESTÁPALA © 2026

</footer>

</body>

</html>
